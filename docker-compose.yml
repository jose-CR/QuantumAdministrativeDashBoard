services:
  web:
    build: .
    image: quantum-app:dev
    container_name: quantum-web
    ports:
      - "8082:80"          # 8080 lo usa app-php-pg
    volumes:
      - ./:/var/www/html   # bind mount: editas en Windows, se ve al instante
      - vendor:/var/www/html/vendor   # vendor en el volumen Linux: composer vuela
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Procesa la cola (exports, imports, notificaciones). Sin este servicio los
  # exports se quedan en `jobs` y el panel nunca genera el archivo.
  # Corre como www-data (33) igual que Apache: si escribe como root, los
  # archivos del export quedan sin permiso de lectura para la descarga.
  worker:
    image: quantum-app:dev
    container_name: quantum-worker
    user: "33:33"
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    command: php artisan queue:work --tries=3 --timeout=120 --sleep=1 --max-time=3600
    restart: unless-stopped

  # Corre el planificador: alerts:generate (una vez al día) y alerts:check.
  scheduler:
    image: quantum-app:dev
    container_name: quantum-scheduler
    user: "33:33"
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    command: php artisan schedule:work
    restart: unless-stopped

  db:
    image: postgres:18
    container_name: quantum-db
    environment:
      POSTGRES_DB: quantum
      POSTGRES_USER: quantum
      POSTGRES_PASSWORD: devpass
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    ports:
      - "5434:5432"        # 5433 lo usa app-php-pg
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantum -d quantum"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # No arranca con "up": solo para compilar assets (ve vendor/ y node_modules/)
  node:
    image: node:22-alpine
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - ./:/app
      - vendor:/app/vendor
      - node_modules:/app/node_modules
    command: sh -c "npm install --no-save --package-lock=false --no-audit --no-fund && npm run build"

volumes:
  pgdata:
  vendor:
  node_modules:
